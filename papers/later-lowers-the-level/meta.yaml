idea: later-lowers-the-level  # the file in ideas/ that the paper grew from
builds-on: []   # other papers in this repository that it cites
keywords: [guarded recursion, later modality, universe levels, predicativity, step-indexing, Kripke logical relations, recursive worlds, topos of trees, higher-order store, Agda]
