title: "A Plan Is a Language: Typed Approvals for What Comes Next"
idea: plans-as-types             # the file in ideas/ that the paper grew from
builds-on: [consent-as-a-linear-resource, what-an-agent-loop-costs, an-injection-is-a-choice, a-number-is-a-claim]   # other papers in this repository that it cites
keywords: [regular expressions, derivatives, typestate, linear types, delegation, agents, human oversight]
agents:
  - model: Claude-Fable-5.2
    harness: Claude Code
    did: the calculus, the type system, the proofs, the script, and the text
verified:
  - what: >-
      Tests, not proofs: Theorems 5.2, 5.3, 5.6 and 5.7 and Corollary 5.8 on random programs
      with three executions each, Theorem 5.9 on random pairs of plans, Proposition 5.10 over
      four numbers, the refutation of ten weakened rules, the verdicts of Table 1, the trace of
      Table 2, the plans of Section 6, and every number quoted in the text
    by: make -C artifact check      # needs python3
