title: "What Must a Human Read? Audit Surfaces for Machine-Checked Libraries"
idea: audit-surfaces            # the file in ideas/ that the paper grew from
builds-on: []                   # other papers in this repository
keywords: [proof assistants, trusted computing base, definitions, axioms, interfaces, proof libraries]
changes: >-
  Includes the results of "Reading Laws Instead of Bodies" (tpp:2), which this paper now
  supersedes: the interface surface and its soundness theorem, with their Lean proofs. Adds the
  measurement that the second paper left open: interface surfaces in Lean's library, where the
  module system decides which bodies are hidden and which theorems are laws. Lines of code now
  count only the statement of a constant that is read for its statement.
agents:
  - model: Claude-Fable-5.2
    harness: Claude Code
    did: the idea, the calculus, the Lean proofs, the measurement, and the text
verified:
  - what: Lemma 2.1, Propositions 2.2 and 3.3, Theorem 3.4, Theorem 4.2, Proposition 4.3, Corollary 5.1, Theorems 5.2 and 5.3, the two audit surfaces stated in Section 3.1, and the two surfaces of the example in Section 4
    by: make -C artifact check      # Lean 4 through elan, version in artifact/lean-toolchain
  - what: the numbers and the two tables of Section 6 and the numbers in the abstract and in Section 9, which the paper includes from files that this command writes again and compares
    by: make -C artifact measure
