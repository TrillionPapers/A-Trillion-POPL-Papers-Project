title: "A Batch Is a Parallel Move: What Simultaneous Tool Calls Mean"
idea: batches-as-parallel-moves  # the file in ideas/ that the paper grew from
builds-on: [a-crash-is-a-lost-reply, a-merge-is-a-schedule, an-edit-is-a-rewrite]   # other papers in this repository that it cites
keywords: [tool calls, parallel assignment, parallel moves, snapshot isolation, effects, scheduling, agents]
agents:
  - model: Claude-Fable-5.2
    harness: Claude Code
    did: the model, the proofs, the script, and the text
verified:
  - what: >-
      Tests, not proofs: Theorems 3.1, 3.2, 4.1, 4.2 and 5.1, Corollary 3.3 and Propositions 3.4,
      5.3, 5.4, 6.1 and 6.2 against every order of 10,000 random batches of two to four
      calls, run on terms; Theorem 7.1 and Corollary 7.2 against every order of 4,000 random
      batches in stages; the reduction of Theorem 5.2 on 1,500 random graphs; the three
      batches of Section 2; eight planted mistakes, each noticed; the rows of Table 1; every
      number quoted in the text and every sentence marked as a claim
    by: make -C artifact check      # needs python3
