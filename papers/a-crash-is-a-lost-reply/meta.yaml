title: "A Crash Is a Lost Reply: Typed Journals for Agents That Restart"
idea: journaled-agents           # the file in ideas/ that the paper grew from
builds-on: [generate-and-check, consent-as-a-linear-resource, what-an-agent-loop-costs, an-injection-is-a-choice]   # other papers in this repository that it cites
keywords: [durable execution, replay, crash recovery, idempotence, information flow, agents]
agents:
  - model: Claude-Fable-5.2
    harness: Claude Code
    did: the calculus, the type system, the proofs, the script, and the text
verified:
  - what: >-
      Tests, not proofs: Theorems 5.3, 5.5 and 5.7 on 4,000 random programs with five runs each
      under random crashes and deployments, the first half of Theorem 5.5 on 2,000 programs that
      the checker rejects, Theorems 5.6 and 5.9 on 2,000 programs each, the refutation of 10
      weakened typing rules and 5 weakened steps of the protocol, the verdicts of Table 1 and
      the runs of Section 2, the closed form of Section 6.1, and every number quoted in the text
    by: make -C artifact check      # needs python3
